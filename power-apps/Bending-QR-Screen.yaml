- bqRoot:
    Control: GroupContainer
    Variant: ManualLayout
    Properties:
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
      Fill: =RGBA(243, 246, 247, 1)
    Children:
      - bqHeader:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =72
            Fill: =RGBA(23, 60, 80, 1)
          Children:
            - bqTitle:
                Control: ModernText
                Properties:
                  Text: ="Bending QR · 曲げパイプ図面"
                  X: =20
                  Y: =12
                  Width: =Parent.Width - 40
                  Height: =48
                  Size: =22
                  FontWeight: =FontWeight.Bold
                  Color: =RGBA(255, 255, 255, 1)
      - bqIntro:
          Control: ModernText
          Properties:
            Text: ="カメラでQRコードを読み取り、アイソメ図を作成します。"
            X: =20
            Y: =88
            Width: =Parent.Width - 40
            Height: =32
            Size: =14
            Color: =RGBA(70, 95, 108, 1)
      - bqScanner:
          Control: BarcodeReader
          Properties:
            Text: ="カメラでQRコードをスキャン"
            BarcodeType: ='Microsoft.BarcodeReader.BarcodeType'.QR
            OnScan: |-
              =If(
                  IsEmpty(bqScanner.Barcodes),
                  Notify("QRコードが見つかりません。", NotificationType.Error),
                  Set(varBqRaw, First(bqScanner.Barcodes).Value);
                  Set(varBqFields, Split(Trim(varBqRaw), ","));
                  If(
                      CountRows(varBqFields) <> 14,
                      Set(varBqStatus, "QRコードは14項目である必要があります。現在の項目数: " & Text(CountRows(varBqFields)) & "。");
                      Notify(varBqStatus, NotificationType.Error),
                      If(
                          CountIf(varBqFields, IsBlank(Trim(Value))) > 0,
                          Set(varBqStatus, "QRコードに空の項目があります。");
                          Notify(varBqStatus, NotificationType.Error),
                          IfError(
                              Set(varBqOrder, Trim(Index(varBqFields, 1).Value));
                              Set(varBqPart, Trim(Index(varBqFields, 2).Value));
                              Set(varBqMaterial, Trim(Index(varBqFields, 3).Value));
                              Set(varBqOD, Value(Trim(Index(varBqFields, 4).Value), "en-US"));
                              Set(varBqWall, Value(Trim(Index(varBqFields, 5).Value), "en-US"));
                              Set(varBqR1, Value(Trim(Index(varBqFields, 6).Value), "en-US"));
                              Set(varBqA1Deg, Value(Trim(Index(varBqFields, 7).Value), "en-US"));
                              Set(varBqR2, Value(Trim(Index(varBqFields, 8).Value), "en-US"));
                              Set(varBqA2Deg, Value(Trim(Index(varBqFields, 9).Value), "en-US"));
                              Set(varBqRollDeg, Value(Trim(Index(varBqFields, 10).Value), "en-US"));
                              Set(varBqN1, Value(Trim(Index(varBqFields, 11).Value), "en-US"));
                              Set(varBqN2, Value(Trim(Index(varBqFields, 12).Value), "en-US"));
                              Set(varBqN3, Value(Trim(Index(varBqFields, 13).Value), "en-US"));
                              Set(varBqReserved, Trim(Index(varBqFields, 14).Value));
                              If(
                                  varBqOD <= 0 || varBqWall <= 0 || 2 * varBqWall >= varBqOD ||
                                  varBqN1 <= 0 || varBqN2 <= 0 || varBqN3 <= 0 ||
                                  varBqR1 <= varBqOD / 2 || varBqR2 <= varBqOD / 2 ||
                                  varBqA1Deg <= 0 || varBqA1Deg >= 180 ||
                                  varBqA2Deg <= 0 || varBqA2Deg >= 180,
                                  Set(varBqStatus, "寸法が無効です。外径、肉厚、直管長N、曲げ半径R、曲げ角度を確認してください。");
                                  Notify(varBqStatus, NotificationType.Error),
                                  Set(varBqStatus, "QRコードを読み取りました。「図面を作成」を押してください。")
                              )
                          ,
                              Set(varBqStatus, "QRコードの数値を読み取れません。データ形式を確認してください。");
                              Notify(varBqStatus, NotificationType.Error)
                          )
                      )
                  )
              )
            X: =20
            Y: =132
            Width: =Parent.Width - 40
            Height: =48
      - bqSample:
          Control: ModernButton
          Properties:
            Text: ="サンプルデータ"
            OnSelect: |-
              =Set(varBqRaw, "93131310540501,DT11-111-7,STPG370,114.3,6.0,170,43.4,170,100.0,-83.14,112,304,213,0");
              Set(varBqFields, Split(varBqRaw, ","));
              Set(varBqOrder, Trim(Index(varBqFields, 1).Value));
              Set(varBqPart, Trim(Index(varBqFields, 2).Value));
              Set(varBqMaterial, Trim(Index(varBqFields, 3).Value));
              Set(varBqOD, Value(Trim(Index(varBqFields, 4).Value), "en-US"));
              Set(varBqWall, Value(Trim(Index(varBqFields, 5).Value), "en-US"));
              Set(varBqR1, Value(Trim(Index(varBqFields, 6).Value), "en-US"));
              Set(varBqA1Deg, Value(Trim(Index(varBqFields, 7).Value), "en-US"));
              Set(varBqR2, Value(Trim(Index(varBqFields, 8).Value), "en-US"));
              Set(varBqA2Deg, Value(Trim(Index(varBqFields, 9).Value), "en-US"));
              Set(varBqRollDeg, Value(Trim(Index(varBqFields, 10).Value), "en-US"));
              Set(varBqN1, Value(Trim(Index(varBqFields, 11).Value), "en-US"));
              Set(varBqN2, Value(Trim(Index(varBqFields, 12).Value), "en-US"));
              Set(varBqN3, Value(Trim(Index(varBqFields, 13).Value), "en-US"));
              Set(varBqReserved, Trim(Index(varBqFields, 14).Value));
              Set(varBqStatus, "サンプルデータを読み込みました。「図面を作成」を押してください。")
            Appearance: =ButtonAppearance.Secondary
            X: =20
            Y: =192
            Width: =(Parent.Width - 52) / 2
            Height: =40
      - bqStatus:
          Control: ModernText
          Properties:
            Text: =Coalesce(varBqStatus, "QRコードは未スキャンです。サンプルデータで試すことができます。")
            X: =20
            Y: =240
            Width: =Parent.Width - 40
            Height: =42
            Size: =12
            Color: =RGBA(80, 105, 118, 1)
            Wrap: =true
      - bqPart:
          Control: ModernText
          Properties:
            Text: =If(IsBlank(varBqPart), "部品情報", varBqPart & " · " & varBqMaterial & " · 外径 " & Text(varBqOD) & " × 肉厚 " & Text(varBqWall) & " mm")
            X: =20
            Y: =290
            Width: =Parent.Width - 40
            Height: =38
            Size: =16
            FontWeight: =FontWeight.Bold
            Color: =RGBA(23, 60, 80, 1)
      - bqDimensions:
          Control: ModernText
          Properties:
            Text: |-
              =If(
                  IsBlank(varBqPart),
                  "QRコードをスキャンすると、直管長N、曲げ半径R、曲げ角度を表示します。",
                  "直管長: N1 " & Text(varBqN1) & " mm · N2 " & Text(varBqN2) & " mm · N3 " & Text(varBqN3) &
                  " mm" & Char(10) &
                  "曲げ: B1 R" & Text(varBqR1) & " / " & Text(varBqA1Deg) & "° · B2 R" &
                  Text(varBqR2) & " / " & Text(varBqA2Deg) & "°" & Char(10) &
                  "ねじり角: " & Text(varBqRollDeg) & "° · 展開長: " &
                  Text(varBqDeveloped, "0.00") & " mm · 予備項目: " & varBqReserved
              )
            X: =20
            Y: =332
            Width: =Parent.Width - 40
            Height: =78
            Size: =12
            Color: =RGBA(70, 95, 108, 1)
            Wrap: =true
      - bqDrawing:
          Control: Image
          Properties:
            Image: =If(IsBlank(varBqSvg), Blank(), "data:image/svg+xml;utf8," & EncodeUrl(varBqSvg))
            ImagePosition: =ImagePosition.Fit
            X: =20
            Y: =420
            Width: =Parent.Width - 40
            Height: =Parent.Height - 440
      - bqDraw:
          Control: ModernButton
          Properties:
            Text: ="図面を作成"
            DisplayMode: =If(IsBlank(varBqPart), DisplayMode.Disabled, DisplayMode.Edit)
            Appearance: =ButtonAppearance.Primary
            OnSelect: |-
              =Set(varBqTheta1, varBqA1Deg * Pi() / 180);
              Set(varBqTheta2, varBqA2Deg * Pi() / 180);
              Set(varBqRoll, varBqRollDeg * Pi() / 180);

              Set(varBqD1, {X: Cos(varBqTheta1), Y: Sin(varBqTheta1), Z: 0});
              Set(varBqURoll, {
                  X: -Sin(varBqTheta1) * Cos(varBqRoll),
                  Y: Cos(varBqTheta1) * Cos(varBqRoll),
                  Z: Sin(varBqRoll)
              });
              Set(varBqPC1, {X: varBqN1, Y: 0, Z: 0});
              Set(varBqPT1, {
                  X: varBqN1 + varBqR1 * Sin(varBqTheta1),
                  Y: varBqR1 * (1 - Cos(varBqTheta1)),
                  Z: 0
              });
              Set(varBqPC2, {
                  X: varBqPT1.X + varBqN2 * varBqD1.X,
                  Y: varBqPT1.Y + varBqN2 * varBqD1.Y,
                  Z: varBqPT1.Z + varBqN2 * varBqD1.Z
              });
              Set(varBqD2, {
                  X: Cos(varBqTheta2) * varBqD1.X + Sin(varBqTheta2) * varBqURoll.X,
                  Y: Cos(varBqTheta2) * varBqD1.Y + Sin(varBqTheta2) * varBqURoll.Y,
                  Z: Cos(varBqTheta2) * varBqD1.Z + Sin(varBqTheta2) * varBqURoll.Z
              });
              Set(varBqPT2, {
                  X: varBqPC2.X + varBqR2 * (Sin(varBqTheta2) * varBqD1.X + (1 - Cos(varBqTheta2)) * varBqURoll.X),
                  Y: varBqPC2.Y + varBqR2 * (Sin(varBqTheta2) * varBqD1.Y + (1 - Cos(varBqTheta2)) * varBqURoll.Y),
                  Z: varBqPC2.Z + varBqR2 * (Sin(varBqTheta2) * varBqD1.Z + (1 - Cos(varBqTheta2)) * varBqURoll.Z)
              });
              Set(varBqEnd, {
                  X: varBqPT2.X + varBqN3 * varBqD2.X,
                  Y: varBqPT2.Y + varBqN3 * varBqD2.Y,
                  Z: varBqPT2.Z + varBqN3 * varBqD2.Z
              });

              Clear(colBqPoints);
              ForAll(
                  Sequence(21) As q,
                  With(
                      {t: (q.Value - 1) / 20},
                      Collect(colBqPoints, {
                          Piece: 1, Step: q.Value,
                          X: (t * varBqN1) / Sqrt(2),
                          Y: -(t * varBqN1) / Sqrt(6)
                      })
                  )
              );
              ForAll(
                  Sequence(21) As q,
                  With(
                      {a: ((q.Value - 1) / 20) * varBqTheta1},
                      With(
                          {
                              x: varBqPC1.X + varBqR1 * Sin(a),
                              y: varBqPC1.Y + varBqR1 * (1 - Cos(a)),
                              z: 0
                          },
                          Collect(colBqPoints, {
                              Piece: 2, Step: q.Value,
                              X: (x + y) / Sqrt(2),
                              Y: (-x + y + 2 * z) / Sqrt(6)
                          })
                      )
                  )
              );
              ForAll(
                  Sequence(21) As q,
                  With(
                      {t: (q.Value - 1) / 20},
                      With(
                          {
                              x: varBqPT1.X + t * varBqN2 * varBqD1.X,
                              y: varBqPT1.Y + t * varBqN2 * varBqD1.Y,
                              z: varBqPT1.Z + t * varBqN2 * varBqD1.Z
                          },
                          Collect(colBqPoints, {
                              Piece: 3, Step: q.Value,
                              X: (x + y) / Sqrt(2),
                              Y: (-x + y + 2 * z) / Sqrt(6)
                          })
                      )
                  )
              );
              ForAll(
                  Sequence(21) As q,
                  With(
                      {a: ((q.Value - 1) / 20) * varBqTheta2},
                      With(
                          {
                              x: varBqPC2.X + varBqR2 * (Sin(a) * varBqD1.X + (1 - Cos(a)) * varBqURoll.X),
                              y: varBqPC2.Y + varBqR2 * (Sin(a) * varBqD1.Y + (1 - Cos(a)) * varBqURoll.Y),
                              z: varBqPC2.Z + varBqR2 * (Sin(a) * varBqD1.Z + (1 - Cos(a)) * varBqURoll.Z)
                          },
                          Collect(colBqPoints, {
                              Piece: 4, Step: q.Value,
                              X: (x + y) / Sqrt(2),
                              Y: (-x + y + 2 * z) / Sqrt(6)
                          })
                      )
                  )
              );
              ForAll(
                  Sequence(21) As q,
                  With(
                      {t: (q.Value - 1) / 20},
                      With(
                          {
                              x: varBqPT2.X + t * varBqN3 * varBqD2.X,
                              y: varBqPT2.Y + t * varBqN3 * varBqD2.Y,
                              z: varBqPT2.Z + t * varBqN3 * varBqD2.Z
                          },
                          Collect(colBqPoints, {
                              Piece: 5, Step: q.Value,
                              X: (x + y) / Sqrt(2),
                              Y: (-x + y + 2 * z) / Sqrt(6)
                          })
                      )
                  )
              );

              Set(varBqMinX, Min(colBqPoints, X));
              Set(varBqMaxX, Max(colBqPoints, X));
              Set(varBqMinY, Min(colBqPoints, Y));
              Set(varBqMaxY, Max(colBqPoints, Y));
              Set(varBqSvgWidth, Max(100, varBqMaxX - varBqMinX + 40));
              Set(varBqSvgHeight, Max(100, varBqMaxY - varBqMinY + 40));
              Set(
                  varBqSvg,
                  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 " &
                  Text(varBqSvgWidth, "0.###", "en-US") & " " &
                  Text(varBqSvgHeight, "0.###", "en-US") &
                  "'><rect width='100%' height='100%' fill='white'/><g fill='none' stroke='#176b81' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'>" &
                  "<path d='" & Concat(Sort(Filter(colBqPoints, Piece = 1), Step, SortOrder.Ascending), If(Step = 1, "M", "L") & Text(X - varBqMinX + 20, "0.###", "en-US") & " " & Text(varBqMaxY - Y + 20, "0.###", "en-US") & " ") & "'/>" &
                  "<path d='" & Concat(Sort(Filter(colBqPoints, Piece = 2), Step, SortOrder.Ascending), If(Step = 1, "M", "L") & Text(X - varBqMinX + 20, "0.###", "en-US") & " " & Text(varBqMaxY - Y + 20, "0.###", "en-US") & " ") & "'/>" &
                  "<path d='" & Concat(Sort(Filter(colBqPoints, Piece = 3), Step, SortOrder.Ascending), If(Step = 1, "M", "L") & Text(X - varBqMinX + 20, "0.###", "en-US") & " " & Text(varBqMaxY - Y + 20, "0.###", "en-US") & " ") & "'/>" &
                  "<path d='" & Concat(Sort(Filter(colBqPoints, Piece = 4), Step, SortOrder.Ascending), If(Step = 1, "M", "L") & Text(X - varBqMinX + 20, "0.###", "en-US") & " " & Text(varBqMaxY - Y + 20, "0.###", "en-US") & " ") & "'/>" &
                  "<path d='" & Concat(Sort(Filter(colBqPoints, Piece = 5), Step, SortOrder.Ascending), If(Step = 1, "M", "L") & Text(X - varBqMinX + 20, "0.###", "en-US") & " " & Text(varBqMaxY - Y + 20, "0.###", "en-US") & " ") & "'/>" &
                  "</g></svg>"
              );
              Set(varBqDeveloped, varBqN1 + varBqN2 + varBqN3 + varBqR1 * varBqTheta1 + varBqR2 * varBqTheta2);
              Set(varBqStatus, "図面を作成しました。製作前に、ねじり角の方向が機械の規約と一致することを確認してください。")
            X: =32 + (Parent.Width - 52) / 2
            Y: =192
            Width: =(Parent.Width - 52) / 2
            Height: =40
